name: Build and publish server image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build Linux image for integration tests
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: exporter:test
          cache-from: type=gha,scope=server-amd64
          cache-to: type=gha,mode=max,scope=server-amd64
      - name: Test authentication, images and both real PDF engines
        run: >-
          docker run --rm --init --shm-size=1g --cap-drop=ALL
          --security-opt seccomp=./deploy/chromium-seccomp.json
          -v "$PWD/local-pdf-server/verify-deployment.py:/checks/verify-deployment.py:ro"
          exporter:test python3 /checks/verify-deployment.py --server-dir /app
      - name: Verify generated extension
        run: |
          python3 local-pdf-server/prepare_extension.py --update
          node local-pdf-server/verify-extension.mjs
      - name: Package unpacked extension
        run: cd local-extension && zip -qr ../chatgpt-exporter-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-exporter-extension
          path: chatgpt-exporter-extension.zip

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Registry image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/chatgpt-exporter-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=server-amd64
            type=gha,scope=server-multiarch
          cache-to: type=gha,mode=max,scope=server-multiarch
