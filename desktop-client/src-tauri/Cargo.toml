[package]
name = "archive-reader"
version = "0.16.8"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.23"
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }
objc2-foundation = "0.3"
block2 = "0.6"
[profile.release]
opt-level = "s"
lto = true
# Rust#157750: do not strip build-time dylibs on macOS 27.
# package-macos.mjs strips only the final executable with the platform tool.
strip = false
