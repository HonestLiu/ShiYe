<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="ui.css">
    <script src="core.js" defer></script>
    <script src="custom-select.js" defer></script>
    <script src="popup.js" defer></script>
    <title>拾页 · 稍后读助手</title>
</head>

<body class="popup">
    <header><img src="icons/48.png" alt="" width="32" height="32"><strong>拾页 <small>个人阅读空间</small></strong><button
            id="settings" class="header-action" aria-label="插件设置" title="插件设置">⚙</button></header>
    <main>
        <section id="web-page" hidden>
            <p class="popup-kicker">当前网页</p>
            <h1 id="web-title"></h1>
            <p id="web-origin"></p><button id="open-page" class="primary" disabled>保存当前网页</button><label
                class="check"><input id="pin-site" type="checkbox" disabled>在此网站自动显示保存入口</label>
            <p class="popup-hint">同时保存网页原貌与正文，随时离线阅读。</p>
            <p class="permission-hint">已启用全站采集权限，普通网页自动显示贴边入口。</p>
        </section>
        <section id="chat-tools" hidden><button id="select" class="primary">选择消息</button><label
                for="range">默认选择范围</label><select id="range">
                <option value="all">全部消息</option>
                <option value="questions">仅提问</option>
                <option value="answers">仅回答</option>
                <option value="none">不选择</option>
            </select><label for="format">默认导出格式</label><select id="format">
                <option value="md">Markdown</option>
                <option value="pdf">PDF</option>
                <option value="txt">Text</option>
                <option value="csv">CSV</option>
                <option value="json">JSON</option>
            </select><label class="check"><input id="display" type="checkbox" checked>显示页面内导出按钮</label></section>
        <div class="popup-links"><button id="translate-open">必应翻译 <span>免密钥翻译文字</span></button><button id="page-notes" hidden>本页标注与笔记 <span>查看和同步当前网页的记录</span></button><button
                id="reading-library">阅读笔记 <span>查看高亮与标注</span></button><button id="client-check">连接拾页客户端
                <span>唤起并检查连接</span></button><button id="connection">连接与服务设置 <span>管理客户端和导出服务</span></button></div><a
            id="chat-link" href="https://chatgpt.com/" target="_blank" rel="noreferrer">打开 ChatGPT 网站 ↗</a>
        <p id="status" role="status"></p>
    </main>
</body>

</html>
