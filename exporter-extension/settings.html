<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导出设置 · 对话存档</title><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="custom-select.js" defer></script><script src="settings.js" defer></script></head><body><main class="settings-page"><header><img src="icons/48.png" alt="" width="32" height="32"><h1>导出设置</h1></header><form id="preferences" method="post"><fieldset><legend>通用设置</legend><label class="check"><input type="checkbox" name="displayBtns">显示页面内导出按钮</label><label class="check"><input type="checkbox" name="copyToClipboard">非 PDF 格式复制到剪贴板</label><label class="check"><input type="checkbox" name="autoCloseSelector">导出后自动关闭选择窗口</label><label class="check"><input type="checkbox" name="muteExport">静默导出（不显示成功弹窗）</label><label class="check"><input type="checkbox" name="saveAs">每次询问文件保存位置</label><label for="default-format">默认导出格式</label><select name="format" id="default-format"><option value="md">Markdown</option><option value="pdf">PDF</option><option value="txt">Text</option><option value="csv">CSV</option><option value="json">JSON</option></select><label for="default-selection">默认选择范围</label><select name="selectType" id="default-selection"><option value="all">全部消息</option><option value="questions">仅提问</option><option value="answers">仅回答</option><option value="none">不选择</option></select></fieldset><button type="submit" class="primary">保存设置</button><button type="button" id="backup">备份设置</button><label for="restore">从备份恢复设置</label><input id="restore" type="file" accept="application/json"><p id="preference-status" role="status"></p></form><section id="desktop"><h2>拾页客户端</h2><p>在客户端的“连接与备份”中填入下面的扩展 ID，即可通过“存到拾页”保存原貌内容。</p><label for="extension-id">当前扩展 ID</label><input id="extension-id" readonly><button id="copy-extension-id">复制扩展 ID</button><button id="check-client">检查客户端连接</button><p id="client-status" role="status"></p></section><section id="connection"><h2>服务设置</h2><form id="connection-form" method="post"><label for="url">服务器地址</label><input name="url" id="url" type="url" value="http://127.0.0.1:8765" spellcheck="false" autocapitalize="off" required><label for="token">访问令牌（可选）</label><input name="token" id="token" type="password" autocomplete="off"><button type="submit" class="primary">保存并检查连接</button><p id="connection-status" role="status"></p></form></section><section><h2>最近的 PDF 任务</h2><p>关闭对话页面后，可在这里继续查询和下载。</p><button id="refresh-jobs">刷新任务</button><div id="history"></div><p id="job-status" role="status"></p></section></main></body></html>
