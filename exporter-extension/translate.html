<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻译 · 拾页</title><link rel="stylesheet" href="ui.css"><script src="core.js" defer></script><script src="custom-select.js" defer></script><script src="translate.js" defer></script></head><body><main class="settings-page"><header><img src="icons/48.png" width="32" height="32" alt=""><h1>必应翻译</h1></header><p>使用必应网页翻译，无需密钥。仅点击翻译时将输入文字发送给必应，单次最多 1000 字符。</p><form id="translation-form"><label for="translation-to">翻译成</label><select id="translation-to"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁体中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select><label for="translation-input">原文</label><textarea id="translation-input" rows="7" maxlength="1000" required style="width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;font:inherit"></textarea><button class="primary" id="translation-submit">翻译</button></form><label for="translation-output">译文</label><textarea id="translation-output" readonly rows="7" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;font:inherit"></textarea><p id="translation-status" role="status" aria-live="polite"></p><button id="translation-copy" disabled>复制译文</button><button id="translation-clear">清除本地翻译缓存</button></main></body></html>
